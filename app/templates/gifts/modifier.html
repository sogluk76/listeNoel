{% extends "base.html" %}

{% block title %}Modifier {{ gift.name }}{% endblock %}

{% block content %}
<h2>Modifier {{ gift.name }}</h2>
{% if erreur %}
<p role="alert">{{ erreur }}</p>
{% endif %}
<form method="post" action="/cadeaux/{{ gift.id }}/modifier" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label for="name">Cadeau</label>
    <input type="text" id="name" name="name" maxlength="150" required value="{{ gift.name }}">

    <label for="price">Prix (€)</label>
    <input type="text" id="price" name="price" value="{{ gift.price if gift.price is not none else '' }}">

    <label for="url">Lien</label>
    <input type="url" id="url" name="url" value="{{ gift.url or '' }}">

    {% if gift.image_path %}
    <img src="/media/{{ gift.image_path }}" alt="" width="80" height="80">
    <label><input type="checkbox" name="remove_image" value="oui"> Supprimer l'image</label>
    {% endif %}
    <label for="image">Remplacer l'image (JPEG, PNG ou WebP, 5 Mo maximum)</label>
    <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/webp">

    <button type="submit">Enregistrer</button>
    <a href="/cadeaux/{{ gift.id }}">Annuler</a>
</form>
{% endblock %}
