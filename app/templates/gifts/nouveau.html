{% extends "base.html" %}

{% block title %}Ajouter un cadeau{% endblock %}

{% block content %}
<h2>Ajouter un cadeau</h2>
{% if erreur %}
<p role="alert">{{ erreur }}</p>
{% endif %}
<form method="post" action="/cadeaux/nouveau" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label for="name">Cadeau</label>
    <input type="text" id="name" name="name" maxlength="150" required>

    <label for="price">Prix (€)</label>
    <input type="text" id="price" name="price">

    <label for="url">Lien</label>
    <input type="url" id="url" name="url">

    <label for="image">Image</label>
    <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/webp">

    <label for="is_suggestion">Suggérer pour quelqu'un d'autre ?</label>
    <select
        id="is_suggestion"
        name="is_suggestion"
        hx-get="/cadeaux/nouveau/destinataire"
        hx-trigger="change"
        hx-target="#destinataire-block"
        hx-include="this"
    >
        <option value="non" selected>Non</option>
        <option value="oui">Oui</option>
    </select>

    <div id="destinataire-block">
        {% include "gifts/_destinataire.html" %}
    </div>

    <button type="submit">Ajouter</button>
    <a href="/">Annuler</a>
</form>
{% endblock %}
