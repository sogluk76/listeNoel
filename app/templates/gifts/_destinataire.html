{% if is_suggestion %}
<label for="recipient_id">Pour qui ?</label>
<select id="recipient_id" name="recipient_id" required>
    <option value="" disabled selected>Choisis un prénom</option>
    {% for autre in autres_membres %}
    <option value="{{ autre.id }}">{{ autre.first_name }}</option>
    {% endfor %}
</select>
<p>Idée de : {{ membre.first_name }}</p>
{% else %}
<p>Pour qui ? <strong>{{ membre.first_name }}</strong></p>
{% endif %}
