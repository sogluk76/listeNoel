{% extends "base.html" %}

{% block title %}Commentaires — {{ gift.name }}{% endblock %}

{% block content %}
<a href="/cadeaux/{{ gift.id }}">&larr; Retour</a>
<h2>Commentaires — {{ gift.name }}</h2>

<div id="messages" hx-get="/cadeaux/{{ gift.id }}/commentaires/fil" hx-trigger="every 20s" hx-swap="innerHTML">
    {% include "comments/_messages.html" %}
</div>

<form
    hx-post="/cadeaux/{{ gift.id }}/commentaires"
    hx-target="#messages"
    hx-swap="innerHTML"
    hx-on::after-request="if (event.detail.successful) this.reset()"
>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="content">Message</label>
    <textarea id="content" name="content" maxlength="1000" required></textarea>
    <button type="submit">Envoyer</button>
</form>
{% endblock %}
