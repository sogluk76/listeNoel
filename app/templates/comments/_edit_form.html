<li id="commentaire-{{ comment.id }}">
    <form
        hx-post="/commentaires/{{ comment.id }}/modifier"
        hx-target="#commentaire-{{ comment.id }}"
        hx-swap="outerHTML"
    >
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <textarea name="content" maxlength="1000" required>{{ comment.content }}</textarea>
        <button type="submit">Enregistrer</button>
    </form>
</li>
