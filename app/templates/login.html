{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<h2>Connexion</h2>
{% if erreur %}
<p role="alert">{{ erreur }}</p>
{% endif %}
<div id="photo-apercu"></div>
<form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="first_name">Prénom</label>
    <select
        id="first_name"
        name="first_name"
        required
        hx-get="/login/photo"
        hx-trigger="change"
        hx-target="#photo-apercu"
        hx-include="this"
    >
        <option value="" disabled selected>Choisis ton prénom</option>
        {% for membre in membres %}
        <option value="{{ membre.first_name }}">{{ membre.first_name }}</option>
        {% endfor %}
    </select>

    <label for="password">Mot de passe</label>
    <input type="password" id="password" name="password" required>
    <button type="submit">Se connecter</button>
</form>
{% endblock %}
